<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEAGULL1</title>

  <!-- Google Fonts: Orbitron (ตัวเลขดิจิทัล) & Kanit (ภาษาไทย) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:ital,wght@0,500;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-main: #060709;
      --bg-card: #0c0e12;
      --bg-subcard: #11141a;
      --border-color: #1e232d;
      --text-main: #f3f4f6;
      --text-muted: #6b7280;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-green: #10b981;
      --accent-blue: #38bdf8;
      --accent-yellow: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Kanit', sans-serif;
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 6px 12px;
      gap: 6px;
    }

    /* ===== TOP HEADER ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 34px;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .brand-title .red {
      color: var(--accent-red);
    }

    .header-line {
      flex: 1;
      height: 2px;
      margin: 0 20px;
      background: linear-gradient(90deg, #dc2626 0%, #991b1b 50%, #dc2626 100%);
      opacity: 0.85;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
    }

    .gps-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .gps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .clock-box {
      text-align: right;
      line-height: 1.05;
    }

    .clock-time {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .clock-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== MAIN 3-COLUMN GRID ===== */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 10px;
      min-height: 0;
    }

    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .station-status {
      font-size: 11px;
      color: var(--accent-blue);
      font-weight: 500;
    }

    /* ===== LEFT PANEL: SPEEDOMETER ===== */
    .speed-panel {
      justify-content: space-between;
    }

    .gauge-container {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gauge-wrapper {
      width: min(220px, 38vh);
      height: min(220px, 38vh);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gauge-center-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 10px;
    }

    .speed-value {
      font-family: 'Orbitron', sans-serif;
      font-style: italic;
      font-size: clamp(44px, 8vh, 64px);
      font-weight: 800;
      line-height: 0.95;
      color: #ffffff;
    }

    .speed-unit {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-top: 6px;
    }

    .accel-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-orange);
      margin-top: 8px;
    }

    .sub-cards-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sub-card {
      background-color: var(--bg-subcard);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
    }

    .sub-card-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .sub-card-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }

    /* ===== CENTER PANEL: LIVE MAP ===== */
    .map-panel {
      padding: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #090b0e;
    }

    .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(92%);
    }

    .map-overlay-title {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 500;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #e5e7eb;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    .follow-btn {
      position: absolute;
      bottom: 22px;
      right: 12px;
      z-index: 500;
      background: rgba(12, 14, 18, 0.9);
      color: #ffffff;
      border: 1px solid #2e3646;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Kanit', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .follow-btn:hover {
      border-color: var(--accent-blue);
    }

    .car-dot {
      width: 16px;
      height: 16px;
      background: #38bdf8;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px #38bdf8;
    }

    .ev-pin {
      background: #11141a;
      border: 1.5px solid #facc15;
      color: #facc15;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.45);
      transition: transform 0.15s ease;
    }

    .ev-pin:hover {
      transform: scale(1.2);
      background: #facc15;
      color: #11141a;
    }

    /* ===== RIGHT COLUMN ===== */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .score-panel {
      flex: 0.95;
      justify-content: space-between;
    }

    .score-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 4px 0;
    }

    .score-number {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(38px, 7vh, 52px);
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1;
    }

    .score-label {
      font-size: 15px;
      color: var(--accent-green);
      font-weight: 500;
    }

    .score-bar-bg {
      width: 100%;
      height: 7px;
      background: #181c24;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .score-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--accent-green);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .stations-panel {
      flex: 1.05;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .stations-list {
      margin-top: 6px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      padding-right: 2px;
    }

    .stations-list::-webkit-scrollbar {
      width: 4px;
    }

    .stations-list::-webkit-scrollbar-thumb {
      background: #262c3a;
      border-radius: 4px;
    }

    .station-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-bottom: 1px solid #161a22;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .station-row:hover, .station-row.active {
      background-color: #161b24;
    }

    .station-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72%;
    }

    .bolt-icon {
      color: var(--accent-yellow);
      font-size: 13px;
    }

    .station-dist {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-blue);
      white-space: nowrap;
    }

    /* ===== BOTTOM BAR ===== */
    .bottom-bar {
      height: 45px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 10px;
    }

    .env-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      padding: 0 12px;
      align-items: center;
    }

    .env-label {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.1;
    }

    .env-val {
