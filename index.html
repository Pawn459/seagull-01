<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEAGULL1-ATTO1</title>

  <!-- Google Fonts: Orbitron (ตัวเลขดิจิทัล) & Kanit (ภาษาไทย) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:ital,wght@0,500;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-main: #060709;
      --bg-card: #0c0e12;
      --bg-subcard: #11141a;
      --border-color: #1e232d;
      --text-main: #f3f4f6;
      --text-muted: #6b7280;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-green: #10b981;
      --accent-blue: #38bdf8;
      --accent-yellow: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Kanit', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 10px;
    }

    .digital {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
    }

    /* ===== TOP HEADER ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      white-space: nowrap;
      cursor: pointer;
    }

    .brand-title .red {
      color: var(--accent-red);
    }

    .header-line {
      flex: 1;
      height: 2px;
      margin: 0 20px;
      background: linear-gradient(90deg, #dc2626 0%, #991b1b 50%, #dc2626 100%);
      opacity: 0.85;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
    }

    .gps-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .gps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .clock-box {
      text-align: right;
      line-height: 1.05;
    }

    .clock-time {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }

    .clock-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== MAIN 3-COLUMN GRID ===== */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 10px;
      min-height: 0;
    }

    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ===== LEFT PANEL: SPEEDOMETER ===== */
    .speed-panel {
      justify-content: space-between;
    }

    .gauge-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gauge-wrapper {
      width: 260px;
      height: 260px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gauge-center-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 10px;
    }

    .speed-value {
      font-family: 'Orbitron', sans-serif;
      font-style: italic;
      font-size: 68px;
      font-weight: 800;
      line-height: 0.95;
      color: #ffffff;
    }

    .speed-unit {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-top: 6px;
    }

    .accel-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-orange);
      margin-top: 8px;
    }

    .sub-cards-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sub-card {
      background-color: var(--bg-subcard);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .sub-card-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .sub-card-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }

    /* ===== CENTER PANEL: LIVE MAP ===== */
    .map-panel {
      padding: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #090b0e;
    }

    /* ปรับสีแผนที่ให้เป็นโหมดมืดเหมือนต้นฉบับ */
    .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(92%);
    }

    .map-overlay-title {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 500;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #e5e7eb;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    .follow-btn {
      position: absolute;
      bottom: 22px;
      right: 12px;
      z-index: 500;
      background: rgba(12, 14, 18, 0.9);
      color: #ffffff;
      border: 1px solid #2e3646;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Kanit', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .follow-btn:hover {
      border-color: var(--accent-blue);
    }

    .car-dot {
      width: 16px;
      height: 16px;
      background: #38bdf8;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px #38bdf8;
    }

    /* ===== RIGHT COLUMN ===== */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .score-panel {
      flex: 0.95;
      justify-content: space-between;
    }

    .score-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 6px 0;
    }

    .score-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 54px;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1;
    }

    .score-label {
      font-size: 15px;
      color: var(--accent-green);
      font-weight: 500;
    }

    .score-bar-bg {
      width: 100%;
      height: 8px;
      background: #181c24;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .score-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--accent-green);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .stations-panel {
      flex: 1.05;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .stations-list {
      margin-top: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .station-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 8px;
      border-bottom: 1px solid #161a22;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .station-row:hover, .station-row.active {
      background-color: #161b24;
    }

    .station-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72%;
    }

    .bolt-icon {
      color: var(--accent-yellow);
      font-size: 13px;
    }

    .station-dist {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-blue);
      white-space: nowrap;
    }

    /* ===== BOTTOM BAR ===== */
    .bottom-bar {
      height: 54px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 10px;
    }

    .env-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      padding: 0 12px;
      align-items: center;
    }

    .env-item {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      height: 100%;
    }

    .env-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 45px;
      height: 2px;
      background-color: var(--accent-red);
    }

    .compass-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #2e3646;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text-muted);
      position: relative;
    }

    .compass-needle {
      font-size: 11px;
      color: #ffffff;
      transition: transform 0.2s ease;
    }

    .env-label {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.1;
    }

    .env-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .pm-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .audio-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-dark {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #ffffff;
      border-radius: 10px;
      height: 100%;
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-dark:hover {
      border-color: #374151;
    }

    .btn-sound {
      flex: 1;
    }

    .btn-sound.active {
      border-color: var(--accent-red);
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .sound-select {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #ffffff;
      border-radius: 10px;
      height: 100%;
      padding: 0 12px;
      font-family: 'Kanit', sans-serif;
      font-size: 12px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .speed-limiter {
      display: flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      height: 100%;
      padding: 0 6px;
      gap: 6px;
    }

    .limit-btn {
      background: #161a22;
      border: none;
      color: #9ca3af;
      width: 26px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .limit-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      min-width: 34px;
      text-align: center;
    }

    @media (max-width: 900px) {
      body { overflow-y: auto; height: auto; }
      .main-grid { grid-template-columns: 1fr; }
      .map-panel { height: 340px; }
      .bottom-bar { grid-template-columns: 1fr; height: auto; }
      .env-box, .btn-dark, .sound-select, .speed-limiter { height: 48px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="brand-title" title="คลิกเพื่อแก้ไขชื่อได้ในโค้ด">
      SEAGULL<span class="red">1</span> · PREMIUM
    </div>
    <div class="header-line"></div>
    <div class="header-right">
      <div class="gps-badge">
        <span class="gps-dot" id="gpsDot"></span>
        <span id="gpsText">GPS พร้อมใช้</span>
      </div>
      <div class="clock-box">
        <div class="clock-time" id="clockTime">08:27</div>
        <div class="clock-date" id="clockDate">พุธ 11 พ.ย.</div>
      </div>
    </div>
  </header>

  <!-- MAIN 3 COLUMNS -->
  <main class="main-grid">

    <!-- LEFT: SPEEDOMETER -->
    <section class="panel speed-panel">
      <div class="panel-title">SPEED</div>

      <div class="gauge-container">
        <div class="gauge-wrapper">
          <svg class="gauge-svg" viewBox="0 0 260 260" id="gaugeSvg">
            <defs>
              <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#151922" stop-opacity="0.9" />
                <stop offset="75%" stop-color="#0d1017" stop-opacity="0.95" />
                <stop offset="100%" stop-color="#0c0e12" stop-opacity="0" />
              </radialGradient>
            </defs>
            <circle cx="130" cy="130" r="115" fill="url(#dialGrad)" />
            <g id="gaugeTicks"></g>
          </svg>
          <div class="gauge-center-text">
            <div class="speed-value" id="speedVal">0</div>
            <div class="speed-unit">KM/H</div>
            <div class="accel-value" id="accelVal">+0.00 m/s²</div>
          </div>
        </div>
      </div>

      <div class="sub-cards-3">
        <div class="sub-card">
          <div class="sub-card-label">MAX</div>
          <div class="sub-card-val" id="maxSpeedVal">0</div>
        </div>
        <div class="sub-card">
          <div class="sub-card-label">0-100</div>
          <div class="sub-card-val" id="zeroToHundredVal">--</div>
        </div>
        <div class="sub-card">
          <div class="sub-card-label">BEST</div>
          <div class="sub-card-val" id="bestTimeVal">--</div>
        </div>
      </div>
    </section>

    <!-- CENTER: LIVE MAP -->
    <section class="panel map-panel">
      <div class="map-overlay-title">LIVE MAP</div>
      <div id="map"></div>
      <button class="follow-btn" id="followBtn">◎ ตามรถ</button>
    </section>

    <!-- RIGHT: DRIVE SCORE & CHARGING STATIONS -->
    <div class="right-col">
      <section class="panel score-panel">
        <div class="panel-title">DRIVE SCORE</div>
        <div class="score-display">
          <span class="score-number" id="scoreVal">100</span>
          <span class="score-label" id="scoreText">นุ่มมาก</span>
        </div>
        <div class="score-bar-bg">
          <div class="score-bar-fill" id="scoreBar"></div>
        </div>
        <div class="sub-cards-3">
          <div class="sub-card">
            <div class="sub-card-label">เร่งแรง</div>
            <div class="sub-card-val" id="hardAccelVal">0</div>
          </div>
          <div class="sub-card">
            <div class="sub-card-label">เบรกแรง</div>
            <div class="sub-card-val" id="hardBrakeVal">0</div>
          </div>
          <div class="sub-card">
            <div class="sub-card-label">เลี้ยวแรง</div>
            <div class="sub-card-val" id="hardTurnVal">0</div>
          </div>
        </div>
      </section>

      <section class="panel stations-panel">
        <div class="panel-title">สถานีชาร์จใกล้</div>
        <div class="stations-list" id="stationsList"></div>
      </section>
    </div>

  </main>

  <!-- BOTTOM BAR -->
  <footer class="bottom-bar">
    <!-- Compass & Weather -->
    <div class="env-box">
      <div class="env-item">
        <div class="compass-circle">
          <span class="compass-needle" id="compassNeedle">▲</span>
        </div>
        <div>
          <div class="env-label">เข็มทิศ</div>
          <div class="env-val" id="headingVal">--</div>
        </div>
      </div>

      <div class="env-item" style="justify-content: space-between; padding-left: 8px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="font-size:16px;">☁️</span>
          <div>
            <div class="env-label" id="weatherDesc">เมฆมาก</div>
            <div class="env-val" id="tempVal">31°</div>
          </div>
        </div>
        <div>
          <div class="env-label">PM2.5</div>
          <div class="pm-val" id="pmVal">29</div>
        </div>
      </div>
    </div>

    <!-- Sound & Engine Controls -->
    <div class="audio-controls">
      <button class="btn-dark btn-sound" id="soundBtn">
        <span>🔊</span> <span id="soundBtnText">เสียง</span>
      </button>
      <select class="sound-select" id="engineSelect">
        <option value="v12">Lamborghini V12</option>
        <option value="v8">Ferrari V8</option>
        <option value="gt3">Porsche Flat-6</option>
        <option value="ev">Sport EV Boost</option>
      </select>
      <div class="speed-limiter">
        <button class="limit-btn" id="limitMinus">-</button>
        <span class="limit-val" id="limitVal">120</span>
        <button class="limit-btn" id="limitPlus">+</button>
      </div>
    </div>

    <!-- Reset Button -->
    <button class="btn-dark" id="resetBtn">↺ รีเซ็ต</button>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ===== 1. สร้างขีดมาตรวัด 0 - 160 KM/H =====
    (function drawGaugeTicks() {
      const group = document.getElementById('gaugeTicks');
      const cx = 130, cy = 130, rOuter = 112, rMaj = 100, rMin = 106, rText = 84;
      let html = '';
      for (let s = 0; s <= 160; s += 10) {
        const deg = -210 + (s / 160) * 240;
        const rad = (deg * Math.PI) / 180;
        const isMaj = s % 20 === 0;
        const rIn = isMaj ? rMaj : rMin;
        const x1 = cx + rOuter * Math.cos(rad);
        const y1 = cy + rOuter * Math.sin(rad);
        const x2 = cx + rIn * Math.cos(rad);
        const y2 = cy + rIn * Math.sin(rad);
        const color = s >= 140 ? '#ef4444' : '#4b5563';
        const width = isMaj ? 2.5 : 1.5;

        html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" />`;

        if (isMaj) {
          const tx = cx + rText * Math.cos(rad);
          const ty = cy + rText * Math.sin(rad) + 4;
          html += `<text x="${tx}" y="${ty}" fill="#6b7280" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" text-anchor="middle">${s}</text>`;
        }
      }
      group.innerHTML = html;
    })();

    // ===== 2. นาฬิกาและวันที่ภาษาไทย =====
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${hh}:${mm}`;

      const days = ['อา.', 'จ.', 'อ.', 'พุธ', 'พฤ.', 'ศ.', 'ส.'];
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      document.getElementById('clockDate').textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ===== 3. แผนที่เริ่มต้นที่ประเทศไทย (รังสิต ปทุมธานี) =====
    let currentLat = 13.9892;
    let currentLng = 100.6177;
    let autoFollow = true;

    const map = L.map('map', {
      zoomControl: false,
      attributionControl: true
    }).setView([currentLat, currentLng], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const carIcon = L.divIcon({
      className: '',
      html: '<div class="car-dot"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    const carMarker = L.marker([currentLat, currentLng], { icon: carIcon }).addTo(map);
    const stationLayer = L.layerGroup().addTo(map);
    let routeLine = null;

    map.on('dragstart', () => { autoFollow = false; });

    document.getElementById('followBtn').addEventListener('click', () => {
      autoFollow = true;
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      map.flyTo([currentLat, currentLng], 16, { animate: true, duration: 0.8 });
    });

    // ===== 4. ระบบสถานีชาร์จใกล้เคียง (คลิกแล้วเลื่อนแผนที่ + นำทาง) =====
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function renderStations(stations) {
      const listEl = document.getElementById('stationsList');
      listEl.innerHTML = '';
      stationLayer.clearLayers();

      stations.forEach((st, idx) => {
        const dist = getDistanceKm(currentLat, currentLng, st.lat, st.lng).toFixed(1);

        // หมุดสถานีบนแผนที่
        const stIcon = L.divIcon({
          className: '',
          html: `<div style="background:#11141a;border:1.5px solid #facc15;color:#facc15;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 0 8px rgba(250,204,21,0.5);">⚡</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const marker = L.marker([st.lat, st.lng], { icon: stIcon }).addTo(stationLayer);
        marker.bindPopup(`
          <div style="font-family:'Kanit',sans-serif;color:#111;min-width:165px;">
            <div style="font-weight:600;font-size:14px;">⚡ ${st.name}</div>
            <div style="color:#0284c7;font-size:12px;margin:2px 0 6px;">ห่างจากรถ ${dist} km</div>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lng}" target="_blank"
               style="display:inline-block;background:#0284c7;color:#fff;text-decoration:none;padding:4px 10px;border-radius:5px;font-size:12px;">
               🗺️ นำทาง Google Maps
            </a>
          </div>
        `);

        // รายการด้านขวา
        const row = document.createElement('div');
        row.className = 'station-row';
        row.innerHTML = `
          <div class="station-name"><span class="bolt-icon">⚡</span> ${st.name}</div>
          <div class="station-dist">${dist}km</div>
        `;

        row.addEventListener('click', () => {
          document.querySelectorAll('.station-row').forEach(r => r.classList.remove('active'));
          row.classList.add('active');
          autoFollow = false;

          if (routeLine) map.removeLayer(routeLine);
          routeLine = L.polyline([[currentLat, currentLng], [st.lat, st.lng]], {
            color: '#38bdf8',
            weight: 3,
            dashArray: '6, 8'
          }).addTo(map);

          map.flyTo([st.lat, st.lng], 16, { animate: true, duration: 1.0 });
          marker.openPopup();
        });

        listEl.appendChild(row);
      });
    }

    function loadDefaultStationsAround(lat, lng) {
      const defaults = [
        { name: 'PTT EV Station PluZ', lat: lat + 0.012, lng: lng + 0.006 },
        { name: 'EA Anywhere Charging', lat: lat - 0.016, lng: lng + 0.014 },
        { name: 'PEA VOLTA Station', lat: lat + 0.022, lng: lng - 0.015 },
        { name: 'Altervim SuperCharge', lat: lat - 0.025, lng: lng - 0.018 }
      ];
      renderStations(defaults);
    }

    loadDefaultStationsAround(currentLat, currentLng);

    // ===== 5. ระบบคำนวณความเร็ว คะแนนขับขี่ และ GPS =====
    let maxSpeed = 0;
    let driveScore = 100;
    let hardAccel = 0, hardBrake = 0, hardTurn = 0;
    let prevSpeedMps = 0, prevTime = Date.now(), prevHeading = null;
    let speedLimit = 120;

    function updateTelemetry(speedKmh, accelMps2, heading) {
      const roundedSpeed = Math.max(0, Math.round(speedKmh));
      document.getElementById('speedVal').textContent = roundedSpeed;

      const sign = accelMps2 >= 0 ? '+' : '';
      document.getElementById('accelVal').textContent = `${sign}${accelMps2.toFixed(2)} m/s²`;

      if (roundedSpeed > maxSpeed) {
        maxSpeed = roundedSpeed;
        document.getElementById('maxSpeedVal').textContent = maxSpeed;
      }

      if (accelMps2 > 3.2) {
        hardAccel++;
        driveScore = Math.max(0, driveScore - 2);
        document.getElementById('hardAccelVal').textContent = hardAccel;
      } else if (accelMps2 < -3.5) {
        hardBrake++;
        driveScore = Math.max(0, driveScore - 2);
        document.getElementById('hardBrakeVal').textContent = hardBrake;
      }

      if (heading !== null && !isNaN(heading)) {
        const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        const dirText = dirs[Math.round(heading / 45) % 8];
        document.getElementById('headingVal').textContent = `${dirText} ${Math.round(heading)}°`;
        document.getElementById('compassNeedle').style.transform = `rotate(${heading}deg)`;

        if (prevHeading !== null && roundedSpeed > 20) {
          let diff = Math.abs(heading - prevHeading);
          if (diff > 180) diff = 360 - diff;
          if (diff > 35) {
            hardTurn++;
            driveScore = Math.max(0, driveScore - 2);
            document.getElementById('hardTurnVal').textContent = hardTurn;
          }
        }
        prevHeading = heading;
      }

      document.getElementById('scoreVal').textContent = driveScore;
      document.getElementById('scoreBar').style.width = `${driveScore}%`;
      document.getElementById('scoreText').textContent = driveScore >= 85 ? 'นุ่มมาก' : (driveScore >= 60 ? 'ปกติ' : 'ซิ่ง');

      updateEnginePitch(roundedSpeed);
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        const { latitude, longitude, accuracy, speed, heading } = pos.coords;

        // ป้องกันกรณีเปิดบนคอมพิวเตอร์ที่เน็ตชี้ IP ไปทวีปอื่น (นอกโซนเอเชียตะวันออกเฉียงใต้)
        const isInThailandRegion = (latitude >= 5 && latitude <= 21 && longitude >= 97 && longitude <= 106);
        if (isInThailandRegion) {
          currentLat = latitude;
          currentLng = longitude;
          carMarker.setLatLng([currentLat, currentLng]);
          if (autoFollow) map.setView([currentLat, currentLng]);
        }

        document.getElementById('gpsText').textContent = `GPS ±${Math.round(accuracy)}m`;

        const now = Date.now();
        const dt = Math.max(0.5, (now - prevTime) / 1000);
        const spdMps = speed || 0;
        const accel = (spdMps - prevSpeedMps) / dt;
        prevSpeedMps = spdMps;
        prevTime = now;

        updateTelemetry(spdMps * 3.6, accel, heading);
      }, () => {
        document.getElementById('gpsText').textContent = 'GPS รอสัญญาณ';
      }, { enableHighAccuracy: true, maximumAge: 1000 });
    }

    // ===== 6. ระบบเสียงเครื่องยนต์จำลอง (Web Audio API) =====
    let audioCtx = null;
    let osc = null;
    let gainNode = null;
    let soundOn = false;

    function updateEnginePitch(speedKmh) {
      if (!soundOn || !osc || !audioCtx) return;
      const type = document.getElementById('engineSelect').value;
      const baseFreq = type === 'v12' ? 65 : (type === 'v8' ? 50 : (type === 'gt3' ? 58 : 110));
      osc.frequency.setTargetAtTime(baseFreq + speedKmh * 2.2, audioCtx.currentTime, 0.1);
    }

    document.getElementById('soundBtn').addEventListener('click', function() {
      soundOn = !soundOn;
      this.classList.toggle('active', soundOn);
      if (soundOn) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 65;
        gainNode.gain.value = 0.06;
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
      } else if (osc) {
        osc.stop();
        osc.disconnect();
        osc = null;
      }
    });

    // ปุ่มปรับตัวเลขความเร็วแจ้งเตือน & ปุ่มรีเซ็ต
    document.getElementById('limitMinus').addEventListener('click', () => {
      speedLimit = Math.max(40, speedLimit - 10);
      document.getElementById('limitVal').textContent = speedLimit;
    });
    document.getElementById('limitPlus').addEventListener('click', () => {
      speedLimit = Math.min(200, speedLimit + 10);
      document.getElementById('limitVal').textContent = speedLimit;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      maxSpeed = 0;
      driveScore = 100;
      hardAccel = 0; hardBrake = 0; hardTurn = 0;
      document.getElementById('maxSpeedVal').textContent = '0';
      document.getElementById('zeroToHundredVal').textContent = '--';
      document.getElementById('scoreVal').textContent = '100';
      document.getElementById('scoreBar').style.width = '100%';
      document.getElementById('scoreText').textContent = 'นุ่มมาก';
      document.getElementById('hardAccelVal').textContent = '0';
      document.getElementById('hardBrakeVal').textContent = '0';
      document.getElementById('hardTurnVal').textContent = '0';
    });
  </script>
</body>
</html>
